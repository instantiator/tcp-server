# ── Shared environment blocks (YAML anchors) ────────────────────────────────
# Internal URLs are Docker-network only — never exposed to the host.
x-internal-urls: &internal-urls
  DATABASE_URL: postgres://${DB_USER:-lcp}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-lcp}
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: http://minio:9000
  MCP_STORAGE_URL: http://lcp-mcp-storage:3010
  MCP_MEMORY_URL: http://lcp-mcp-memory:3011
  MCP_INTERACTIONS_URL: http://lcp-mcp-interactions:3012
  MCP_TASKS_URL: http://lcp-mcp-tasks:3013
  LCP_SERVER_URL: http://lcp-server:3000
  OIDC_INTERNAL_ISSUER_URL: http://zitadel:8080

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lcp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-lcp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${EXPOSE_PORT_DB:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-lcp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Redis is internal-only — not exposed to the host.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":${EXPOSE_PORT_MINIO_CONSOLE:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "${EXPOSE_PORT_MINIO:-9000}:9000"
      - "${EXPOSE_PORT_MINIO_CONSOLE:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  stub-llm:
    build:
      context: ./apps/lcp-stub-llm
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [integration]
    # Internal-only by default (see docker-compose.dev-ports.yml to publish).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.1
    restart: unless-stopped
    profiles: [auth]
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: lcp
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${DB_USER:-lcp}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY}
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      # The `zitadel ready` healthcheck below is a separate process invocation
      # that doesn't see the `--tlsMode disabled` start-from-init flag above —
      # it reads this env var independently to decide HTTP vs HTTPS for its
      # own self-check, and defaults to HTTPS (failing against our plain-HTTP
      # server) without it.
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: lcp
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      # Bootstrap machine user: start-deployment.sh authenticates to the Zitadel
      # API as this user (via the PAT written to /machinekey/pat.txt below) to
      # script project/app/user creation, since Zitadel has no ROPC grant to
      # obtain an admin session token the way kcadm.sh does for Keycloak.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: lcp-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: LCP Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
    volumes:
      # Bind mount (not a named volume): the zitadel process runs as uid 1000
      # and a fresh named volume is root-owned, so writing the PAT fails with
      # "permission denied". start-deployment.sh chmods this host directory
      # before bringing the stack up. Only written once, on first boot — the
      # FIRSTINSTANCE steps are skipped on subsequent starts against existing data.
      #
      # Scoped by ${COMPOSE_PROJECT_NAME} (Compose auto-populates this from
      # `-p`/`--project-name`, even when set via a flag rather than the env
      # var of the same name): every Compose project using this file gets its
      # own Postgres volume, and therefore its own independently-bootstrapped
      # Zitadel instance, but a single unscoped path here would still point
      # every project at the same host file. Whichever project bootstrapped
      # most recently would silently overwrite it with its own PAT, breaking
      # every *other* already-running project's auth against a still-valid
      # local Zitadel — the PAT would authenticate fine, just against the
      # wrong instance's admin API. Scoping this by project makes each
      # project's PAT file track only its own Zitadel instance's lifecycle,
      # restoring the 1:1 relationship start-deployment.sh's freshness check
      # (ZITADEL_FRESH_BOOT, keyed on that same project's Postgres volume)
      # already assumes.
      - ./docker/zitadel-machinekey/${COMPOSE_PROJECT_NAME}:/machinekey
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EXPOSE_PORT_ZITADEL:-8080}:8080"
    healthcheck:
      # No shell or curl in this image (single static Go binary) — use the
      # CLI's own readiness subcommand instead of a curl/wget healthcheck.
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  lcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-server
    image: lcp-server:latest
    restart: unless-stopped
    environment:
      <<: *internal-urls
      # External-facing issuer (the `iss` claim tokens carry, validated literally);
      # OIDC_INTERNAL_ISSUER_URL (from *internal-urls) is used for the in-cluster
      # JWKS fetch. Explicit value wins, else derive from the Zitadel host port —
      # mirrors scripts/lib/derive-urls.sh.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:${EXPOSE_PORT_ZITADEL:-8080}}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Only present (profile: auth) when Zitadel is part of the deployment;
      # `required: false` lets Compose skip this dependency entirely when it
      # isn't. When it is, wait for Zitadel's own healthcheck before starting
      # lcp-server, rather than racing it (was: lcp-server started immediately
      # and polled a not-yet-listening provider, sometimes for longer than its
      # own health check's retry budget).
      zitadel:
        condition: service_healthy
        required: false
    ports:
      - "${EXPOSE_PORT_API:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 10

  lcp-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-agent
    image: lcp-agent:latest
    restart: unless-stopped
    environment:
      <<: *internal-urls
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # lcp-agent is a worker — internal-only, not exposed to the host. Its health
    # endpoint is reached container-internally by the healthcheck below. (A host
    # publish here would also collide with lcp-server whenever EXPOSE_PORT_API is
    # set to 3001, as the testing env does.)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  lcp-mcp-storage:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-mcp-storage
    image: lcp-mcp-storage:latest
    restart: unless-stopped
    environment:
      <<: *internal-urls
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      lcp-server:
        condition: service_healthy
    # Internal-only by default (see docker-compose.dev-ports.yml to publish).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  lcp-mcp-memory:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-mcp-memory
    image: lcp-mcp-memory:latest
    restart: unless-stopped
    environment:
      <<: *internal-urls
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    # Internal-only by default (see docker-compose.dev-ports.yml to publish).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  lcp-mcp-interactions:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-mcp-interactions
    image: lcp-mcp-interactions:latest
    restart: unless-stopped
    environment:
      <<: *internal-urls
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      lcp-server:
        condition: service_healthy
    # Internal-only by default (see docker-compose.dev-ports.yml to publish).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3012/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  lcp-mcp-tasks:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-mcp-tasks
    image: lcp-mcp-tasks:latest
    restart: unless-stopped
    environment:
      <<: *internal-urls
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      lcp-server:
        condition: service_healthy
    # Internal-only by default (see docker-compose.dev-ports.yml to publish).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
