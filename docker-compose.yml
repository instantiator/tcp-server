services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  stub-llm:
    build:
      context: ./docker/stub-llm
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [integration]
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    profiles: [auth]
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: lcp
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: localhost
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # Keycloak 24+ serves /health/ready on the management port (9000), not 8080.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      # start_period + retries*interval = 360s: generous headroom for Keycloak's
      # boot under constrained resources (was 210s, too tight — lcp-server would
      # start against a not-yet-ready Keycloak and its own health check would
      # sometimes time out before Keycloak caught up).
      retries: 10
      start_period: 60s

  lcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-server
    image: lcp-server:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lcp:${POSTGRES_PASSWORD}@postgres:5432/lcp
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      OIDC_ISSUER_URL: http://localhost:8080/realms/lcp
      OIDC_INTERNAL_ISSUER_URL: http://keycloak:8080/realms/lcp
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      MCP_STORAGE_URL: http://lcp-mcp-storage:3010
      MCP_MEMORY_URL: http://lcp-mcp-memory:3011
      MCP_INTERACTIONS_URL: http://lcp-mcp-interactions:3012
      MCP_TASKS_URL: http://lcp-mcp-tasks:3013
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Only present (profile: auth) when Keycloak is part of the deployment;
      # `required: false` lets Compose skip this dependency entirely when it
      # isn't. When it is, wait for Keycloak's own healthcheck before starting
      # lcp-server, rather than racing it (was: lcp-server started immediately
      # and polled a not-yet-listening Keycloak, sometimes for longer than its
      # own health check's retry budget).
      keycloak:
        condition: service_healthy
        required: false
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 10

  lcp-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-agent
    image: lcp-agent:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lcp:${POSTGRES_PASSWORD}@postgres:5432/lcp
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MCP_STORAGE_URL: http://lcp-mcp-storage:3010
      MCP_MEMORY_URL: http://lcp-mcp-memory:3011
      MCP_INTERACTIONS_URL: http://lcp-mcp-interactions:3012
      MCP_TASKS_URL: http://lcp-mcp-tasks:3013
      LCP_SERVER_URL: http://lcp-server:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  lcp-mcp-storage:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-mcp-storage
    image: lcp-mcp-storage:latest
    restart: unless-stopped
    environment:
      LCP_SERVER_URL: http://lcp-server:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      lcp-server:
        condition: service_healthy
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  lcp-mcp-memory:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-mcp-memory
    image: lcp-mcp-memory:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lcp:${POSTGRES_PASSWORD}@postgres:5432/lcp
      LCP_SERVER_URL: http://lcp-server:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  lcp-mcp-interactions:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-mcp-interactions
    image: lcp-mcp-interactions:latest
    restart: unless-stopped
    environment:
      LCP_SERVER_URL: http://lcp-server:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      lcp-server:
        condition: service_healthy
    ports:
      - "3012:3012"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3012/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  lcp-mcp-tasks:
    build:
      context: .
      dockerfile: Dockerfile
      target: lcp-mcp-tasks
    image: lcp-mcp-tasks:latest
    restart: unless-stopped
    environment:
      LCP_SERVER_URL: http://lcp-server:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      lcp-server:
        condition: service_healthy
    ports:
      - "3013:3013"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
