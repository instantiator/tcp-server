name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-test:
    name: Unit tests
    needs: [build, lint, typecheck]
    permissions:
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-unit-tests.sh
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit tests
          path: test-results/unit.xml
          reporter: jest-junit
          fail-on-error: false

  integration-test:
    name: Integration tests
    needs: [unit-test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-integration-tests.sh
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration tests
          path: test-results/integration.xml
          reporter: jest-junit
          fail-on-error: false
      - if: always()
        run: docker compose down -v

  api-test:
    name: API tests
    needs: [integration-test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: docker/setup-buildx-action@v4
      - name: Build lcp-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/lcp-server/Dockerfile
          push: false
          load: true
          tags: lcp-server:latest
          cache-from: type=gha,scope=lcp-server
          cache-to: type=gha,scope=lcp-server,mode=max
      - name: Build lcp-agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/lcp-agent/Dockerfile
          push: false
          load: true
          tags: lcp-agent:latest
          cache-from: type=gha,scope=lcp-agent
          cache-to: type=gha,scope=lcp-agent,mode=max
      - run: npm ci
      - run: ./scripts/run-api-tests.sh
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: API tests
          path: test-results/api.xml
          reporter: jest-junit
          fail-on-error: false
      - if: always()
        run: docker compose --profile auth down -v

  e2e-test:
    name: E2E tests
    needs: [integration-test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-e2e-tests.sh
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E tests
          path: test-results/e2e.xml
          reporter: jest-junit
          fail-on-error: false
      - if: always()
        run: docker compose down -v
