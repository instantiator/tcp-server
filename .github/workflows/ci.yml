name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Build, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck

  unit-test:
    name: Unit tests
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-unit-tests.sh
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit tests
          path: test-results/unit.xml
          reporter: jest-junit
          fail-on-error: false

  integration-test:
    name: Integration tests
    needs: [unit-test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Diagnostic: testcontainers drives the `docker compose` CLI, whose
      # behaviour is version-sensitive. Surface the version to catch drift early.
      - name: Docker Compose version
        run: docker compose version
      - run: ./scripts/run-integration-tests.sh
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Integration tests
          path: test-results/integration.xml
          reporter: jest-junit
          fail-on-error: false
      # Containers are torn down by Jest global teardown (and testcontainers'
      # Ryuk reaper on ungraceful exit), so no explicit `docker compose down`.
      # Retain the compose logs a failed startup wrote, for later analysis.
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-compose-logs
          path: test-results/integration-compose-logs/
          if-no-files-found: ignore

  api-test:
    name: API & smoke tests
    needs: [integration-test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: docker/setup-buildx-action@v4
      # One bake build for all six service images. They share the `builder`
      # (npm ci + build:apps) and `prod-deps` stages of the root Dockerfile, so
      # bake resolves those once across the whole graph. Targets/tags come from
      # docker-compose.yml's build config; `output=type=docker` loads them into
      # the local image store for start-deployment.sh to reuse.
      - name: Build service images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          targets: |
            lcp-server
            lcp-agent
            lcp-mcp-storage
            lcp-mcp-memory
            lcp-mcp-interactions
            lcp-mcp-tasks
          set: |
            *.cache-from=type=gha,scope=monorepo-build
            *.cache-to=type=gha,scope=monorepo-build,mode=max
            *.output=type=docker
      - run: npm ci
      - name: Start deployment stack
        run: ./scripts/start-deployment.sh --project lcp-api --env-file .env.testing
      - name: Run API tests
        run: ./scripts/run-api-tests.sh --base-url http://localhost:3000
      - name: Publish API test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: API tests
          path: test-results/api.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Run smoke tests
        run: ./scripts/run-smoke-tests.sh --base-url http://localhost:3000
      - name: Publish smoke test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Smoke tests
          path: test-results/smoke.xml
          reporter: jest-junit
          fail-on-error: false
      - if: always()
        run: docker compose -p lcp-api --profile auth down -v

  e2e-test:
    name: E2E tests
    needs: [integration-test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Diagnostic: testcontainers drives the `docker compose` CLI, whose
      # behaviour is version-sensitive. Surface the version to catch drift early.
      - name: Docker Compose version
        run: docker compose version
      - run: ./scripts/run-e2e-tests.sh
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: E2E tests
          path: test-results/e2e.xml
          reporter: jest-junit
          fail-on-error: false
      # Containers are torn down by Jest global teardown (and testcontainers'
      # Ryuk reaper on ungraceful exit), so no explicit `docker compose down`.
      # Retain the compose logs a failed startup wrote, for later analysis.
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-compose-logs
          path: test-results/e2e-compose-logs/
          if-no-files-found: ignore
