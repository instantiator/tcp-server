name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-test:
    name: Unit tests
    needs: [build, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-unit-tests.sh

  integration-test:
    name: Integration tests
    needs: [unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-integration-tests.sh
      - if: always()
        run: docker compose down -v

  system-test:
    name: System tests
    needs: [integration-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: docker/setup-buildx-action@v3
      # Pre-build the app images using BuildKit's GHA layer cache.
      # docker compose up (in run-system-tests.sh) finds the named images already
      # present and skips the rebuild — the cache benefit applies on every run where
      # package-lock.json is unchanged (i.e. the expensive `npm ci` Docker layer hits).
      - name: Build lcp-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/lcp-server/Dockerfile
          push: false
          load: true
          tags: lcp-server:latest
          cache-from: type=gha,scope=lcp-server
          cache-to: type=gha,scope=lcp-server,mode=max
      - name: Build lcp-agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/lcp-agent/Dockerfile
          push: false
          load: true
          tags: lcp-agent:latest
          cache-from: type=gha,scope=lcp-agent
          cache-to: type=gha,scope=lcp-agent,mode=max
      - run: npm ci
      - run: ./scripts/run-system-tests.sh
      - if: always()
        run: docker compose --profile auth down -v

  e2e-test:
    name: E2E tests
    needs: [system-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-e2e-tests.sh
      - if: always()
        run: docker compose down -v
