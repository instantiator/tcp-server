name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-test:
    name: Unit tests
    needs: [build, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-unit-tests.sh

  integration-test:
    name: Integration tests
    needs: [unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-integration-tests.sh
      - if: always()
        run: docker compose down -v

  smoke-test:
    name: Smoke tests
    needs: [integration-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: docker/setup-buildx-action@v4
      # Pre-build the app images using BuildKit's GHA layer cache.
      # run-smoke-tests.sh calls `docker compose build` which reuses these
      # cached layers — the expensive `npm ci` Docker layer only rebuilds when
      # package-lock.json changes.
      - name: Build lcp-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/lcp-server/Dockerfile
          push: false
          load: true
          tags: lcp-server:latest
          cache-from: type=gha,scope=lcp-server
          cache-to: type=gha,scope=lcp-server,mode=max
      - name: Build lcp-agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/lcp-agent/Dockerfile
          push: false
          load: true
          tags: lcp-agent:latest
          cache-from: type=gha,scope=lcp-agent
          cache-to: type=gha,scope=lcp-agent,mode=max
      - run: npm ci
      - run: ./scripts/run-smoke-tests.sh
      - if: always()
        run: docker compose --profile auth down -v

  api-test:
    name: API tests
    needs: [smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: docker/setup-buildx-action@v4
      - name: Build lcp-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/lcp-server/Dockerfile
          push: false
          load: true
          tags: lcp-server:latest
          cache-from: type=gha,scope=lcp-server
          cache-to: type=gha,scope=lcp-server,mode=max
      - name: Build lcp-agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/lcp-agent/Dockerfile
          push: false
          load: true
          tags: lcp-agent:latest
          cache-from: type=gha,scope=lcp-agent
          cache-to: type=gha,scope=lcp-agent,mode=max
      - run: npm ci
      - run: ./scripts/run-api-tests.sh
      - if: always()
        run: docker compose --profile auth down -v

  e2e-test:
    name: E2E tests
    needs: [smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-e2e-tests.sh
      - if: always()
        run: docker compose down -v
