version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  # lcp-stub-llm has its own package.json — it shares no dependencies with
  # the rest of this monorepo.
  - package-ecosystem: npm
    directory: "/apps/lcp-stub-llm"
    schedule:
      interval: weekly
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: docker
    directory: "/apps/lcp-server"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/lcp-agent"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/lcp-mcp-interactions"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/lcp-mcp-tasks"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/lcp-mcp-memory"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/lcp-mcp-storage"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/lcp-stub-llm"
    schedule:
      interval: weekly
