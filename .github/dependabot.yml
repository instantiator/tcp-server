version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # tcp-stub-llm has its own package.json — it shares no dependencies with
  # the rest of this monorepo.
  - package-ecosystem: npm
    directory: '/apps/tcp-stub-llm'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # The root Dockerfile builds all six services; the per-app Dockerfiles it
  # replaced are gone, so there is nothing to scan under apps/backend.
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: '/apps/tcp-stub-llm'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
