# aislop configuration — see https://github.com/scanaislop/aislop
rules:
  # @tcp/shared is this monorepo's tsconfig path alias, not an npm dependency;
  # the rule cannot resolve workspace aliases, so its 13 findings here are
  # false positives. Kept as a warning (not off) so genuinely hallucinated
  # imports remain visible.
  ai-slop/hallucinated-import: warning
  # The setup wizard generates local dev env files with well-known placeholder
  # credentials (dev-password, etc.) — these are not real secrets.
  security/hardcoded-secret: warning

ci:
  # Current score is 73; ratchet this up as the remaining warnings are cleaned
  # up. 011.1.4 decomposed the 8 server/agent-side oversized files, leaving 4
  # file-too-large findings — all CLI/TUI files owned by 011.1.5, which also
  # owns the remaining duplicate-block warnings.
  failBelow: 71
